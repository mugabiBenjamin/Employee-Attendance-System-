# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: test_employee_attendance_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12.3

      - name: Install dependencies
        working-directory: ./backend
        run: |
          uv sync
          uv pip install pytest pytest-asyncio httpx

      - name: Create test environment file
        working-directory: ./backend
        run: |
          cat > .env << EOF
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/test_employee_attendance_db
          DATABASE_HOST=localhost
          DATABASE_PORT=5432
          DATABASE_NAME=test_employee_attendance_db
          DATABASE_USER=postgres
          DATABASE_PASSWORD=postgres
          APP_NAME=Employee_Management_System
          APP_VERSION=0.1.0
          DEBUG=True
          ENVIRONMENT=testing
          API_V1_STR=/api/v1
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          ACCESS_TOKEN_EXPIRE_MINUTES=30
          REFRESH_TOKEN_EXPIRE_DAYS=7
          BACKEND_CORS_ORIGINS=["http://localhost:3000"]
          MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM=${{ secrets.MAIL_FROM }}
          MAIL_PORT=587
          MAIL_SERVER=smtp.gmail.com
          MAIL_STARTTLS=True
          MAIL_SSL_TLS=False
          REDIS_URL=redis://localhost:6379/0
          CELERY_BROKER_URL=redis://localhost:6379/0
          CELERY_RESULT_BACKEND=redis://localhost:6379/0
          MAX_FILE_SIZE=10485760
          UPLOAD_FOLDER=./uploads
          ALLOWED_EXTENSIONS=["pdf", "doc", "docx", "jpg", "jpeg", "png"]
          LOG_LEVEL=INFO
          LOG_FILE=./logs/app.log
          BCRYPT_ROUNDS=12
          ALGORITHM=HS256
          DEFAULT_PAGE_SIZE=50
          MAX_PAGE_SIZE=100
          DEFAULT_TIMEZONE=UTC
          EOF

      - name: Run backend tests
        working-directory: ./backend
        run: uv run pytest -v

  frontend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: "yarn"
          cache-dependency-path: "./frontend/yarn.lock"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend tests
        working-directory: ./frontend
        run: yarn test --coverage --watchAll=false

      - name: Build frontend
        working-directory: ./frontend
        run: yarn build

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12.3

      - name: Install Python linting tools
        working-directory: ./backend
        run: |
          uv sync
          uv pip install ruff black

      - name: Run Python linting
        working-directory: ./backend
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Setup Node.js for frontend linting
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.1"
          cache: "yarn"
          cache-dependency-path: "./frontend/yarn.lock"

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: yarn install --frozen-lockfile

      - name: Run frontend linting
        working-directory: ./frontend
        run: yarn lint
